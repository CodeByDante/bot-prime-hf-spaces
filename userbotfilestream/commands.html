<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Comandos - Bot Prime</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0c0b12;
            --surface-color: #14131f;
            --border-color: #1f1d2e;
            --border-hover: #322f47;
            --text-primary: #ffffff;
            --text-secondary: #9499b0;
            --accent-color: #7f5af0;
            --accent-hover: #9675fa;
            --accent-gradient: linear-gradient(135deg, #7f5af0 0%, #d53f8c 100%);
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-hover) #0c0b12;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0b12;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        .header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 20px 20px;
            text-align: center;
        }

        h1.title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subtitle span.badge {
            background: rgba(127, 90, 240, 0.12);
            color: #b3a5ff;
            border: 1px solid rgba(127, 90, 240, 0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* Buscador */
        .search-container {
            max-width: 650px;
            margin: 0 auto 25px auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            font-family: inherit;
            font-size: 1rem;
            background: #14131f;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-input:focus {
            border-color: var(--accent-color);
            background: #171624;
            box-shadow: 0 0 0 3px rgba(127, 90, 240, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.2s;
        }

        .search-input:focus + .search-icon {
            color: var(--accent-color);
        }

        /* Barra de Categorías */
        .categories-container {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 15px;
        }

        .cat-btn {
            background: #14131f;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }

        .cat-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
        }

        .cat-btn.active {
            color: #ffffff;
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 2px 10px rgba(127, 90, 240, 0.4);
        }

        /* Grid de Comandos */
        .commands-grid {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 16px;
        }

        @media (min-width: 640px) {
            .commands-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .commands-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .cmd-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .cmd-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .cmd-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
        }

        .cmd-pill {
            background: rgba(127, 90, 240, 0.15);
            border: 1px solid rgba(127, 90, 240, 0.3);
            color: #c4b5fd;
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            word-break: break-all;
        }

        .cmd-pill:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .usage-badge {
            font-size: 0.72rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .cmd-cat-badge {
            font-size: 0.72rem;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 8px;
            display: inline-block;
        }

        .cmd-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 14px;
            flex-grow: 1;
        }

        .cmd-channel {
            font-size: 0.75rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 100%;
            padding: 9px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .copy-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
        }

        /* Notificación Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.95);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        /* Adaptabilidad Móvil Perfeccionada */
        @media (max-width: 680px) {
            body {
                overflow-x: hidden;
                width: 100%;
            }

            .header {
                padding: 24px 12px 16px 12px;
            }

            h1.title {
                font-size: 1.6rem;
                line-height: 1.25;
                word-break: break-word;
            }

            .subtitle {
                font-size: 0.85rem;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
                margin-bottom: 20px;
            }

            .search-container {
                width: 100%;
                max-width: 100%;
                padding: 0 4px;
                margin-bottom: 20px;
            }

            .search-input {
                font-size: 0.9rem;
                padding: 12px 16px 12px 42px;
                border-radius: 10px;
            }

            .search-icon {
                left: 14px;
                width: 18px;
                height: 18px;
            }

            .categories-container {
                max-width: 100%;
                padding: 0 4px;
                gap: 6px;
                margin-bottom: 20px;
            }

            .cat-btn {
                padding: 6px 12px;
                font-size: 0.78rem;
            }

            .commands-grid {
                max-width: 100%;
                padding: 0 8px;
                gap: 12px;
                grid-template-columns: repeat(1, 1fr);
            }

            .cmd-card {
                padding: 14px;
            }

            .cmd-pill {
                font-size: 0.82rem;
                max-width: 100%;
                word-break: break-all;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Comandos de Bot Prime</h1>
        <div class="subtitle">
            <i data-lucide="terminal" style="width: 18px; height: 18px; color: var(--accent-color);"></i>
            <span>Guía Interactiva Oficial</span>
            <span class="badge" id="cmd-count-badge">0 comandos</span>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="search-box" placeholder="Buscar comando por nombre o función (ej: duplicados, capturas, actrices)...">
            <i data-lucide="search" class="search-icon"></i>
        </div>
    </div>

    <div class="categories-container" id="categories-bar">
        <!-- Botones de categoría cargados dinámicamente -->
    </div>

    <div class="commands-grid" id="commands-grid">
        <!-- Tarjetas dinámicas -->
    </div>

    <!-- Notificación Toast -->
    <div class="toast" id="toast-notif">
        <i data-lucide="check-circle-2" style="width: 20px; height: 20px;"></i>
        <span id="toast-text">¡Comando copiado al portapapeles!</span>
    </div>

    <script>
        const commandsData = {{commands_json}};
        
        let activeCategory = "Todas";
        const searchBox = document.getElementById("search-box");
        const categoriesBar = document.getElementById("categories-bar");
        const commandsGrid = document.getElementById("commands-grid");
        const cmdCountBadge = document.getElementById("cmd-count-badge");
        const toast = document.getElementById("toast-notif");
        const toastText = document.getElementById("toast-text");
        let toastTimeout = null;

        function showToast(text) {
            toastText.innerText = text;
            toast.classList.add("show");
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`¡Copiado: ${text}!`);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(`¡Copiado: ${text}!`);
        }

        function initCategories() {
            const categories = ["Todas"];
            commandsData.forEach(c => {
                const cat = c.category || "Otros";
                if (!categories.includes(cat)) {
                    categories.push(cat);
                }
            });

            categoriesBar.innerHTML = "";
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `cat-btn ${cat === activeCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    applyFilter();
                };
                categoriesBar.appendChild(btn);
            });
        }

        function applyFilter() {
            const query = searchBox.value.toLowerCase().trim();
            
            const filtered = commandsData.filter(c => {
                const matchesCat = activeCategory === "Todas" || (c.category || "Otros") === activeCategory;
                const matchesQuery = (c.name && c.name.toLowerCase().includes(query)) ||
                                     (c.title && c.title.toLowerCase().includes(query)) ||
                                     (c.usage && c.usage.toLowerCase().includes(query)) ||
                                     (c.channel && c.channel.toLowerCase().includes(query));
                return matchesCat && matchesQuery;
            });

            renderCommands(filtered);
        }

        function extractCommandSyntax(title) {
            if (!title) return "/help";
            const match = title.match(/`(\/[^`\s]+)/);
            if (match) return match[1];
            const clean = title.replace(/`/g, '').split(' ')[0];
            return clean.startsWith('/') ? clean : `/${clean}`;
        }

        function renderCommands(commands) {
            commandsGrid.innerHTML = "";
            cmdCountBadge.innerText = `${commands.length} comando${commands.length !== 1 ? 's' : ''}`;

            if (commands.length === 0) {
                commandsGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-secondary);">
                        <i data-lucide="help-circle" style="width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4;"></i>
                        <p style="font-size: 1.1rem; font-weight: 600;">No se encontraron comandos</p>
                        <p style="font-size: 0.85rem; margin-top: 4px;">Intenta buscar con otra palabra clave o selecciona otra categoría.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            commands.forEach(cmd => {
                const card = document.createElement("div");
                card.className = "cmd-card";
                
                const cmdSyntax = extractCommandSyntax(cmd.title);
                const usageCount = cmd.uses !== undefined ? cmd.uses : 0;
                
                card.innerHTML = `
                    <div>
                        <span class="cmd-cat-badge">${cmd.category || 'General'}</span>
                        <div class="cmd-header">
                            <div class="cmd-pill" title="Clic para copiar" onclick="copyToClipboard('${cmdSyntax}')">
                                <i data-lucide="terminal" style="width: 14px; height: 14px;"></i>
                                ${cmdSyntax}
                            </div>
                            <span class="usage-badge">${usageCount > 0 ? `${usageCount} usos` : 'Sin usar'}</span>
                        </div>
                        <div class="cmd-desc">${cmd.usage || ''}</div>
                    </div>
                    <div>
                        <div class="cmd-channel">
                            <i data-lucide="info" style="width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--accent-color);"></i>
                            <span>${cmd.channel || 'Cualquier chat'}</span>
                        </div>
                        <button class="copy-btn" onclick="copyToClipboard('${cmdSyntax}')">
                            <i data-lucide="copy" style="width: 14px; height: 14px;"></i>
                            Copiar ${cmdSyntax}
                        </button>
                    </div>
                `;
                commandsGrid.appendChild(card);
            });

            lucide.createIcons();
        }

        function init() {
            initCategories();
            renderCommands(commandsData);
            lucide.createIcons();

            searchBox.addEventListener("input", () => {
                applyFilter();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
